name: my_flutter_template
description: "Flutter structure template"

publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  bloc: ^9.2.0
  equatable: ^2.0.8
  form_validator:
    git: https://github.com/themisir/form-validator.git
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_screenutil: ^5.9.3
  skeletonizer: ^2.1.3
  freezed_annotation: ^3.1.0
  webview_flutter: ^4.13.1

  intl: any
  dio: ^5.9.2
  connectivity_plus: ^7.1.1
  crypto: ^3.0.6
  dartz: ^0.10.1
  json_annotation: ^4.11.0
  #  pretty_bloc_observer: ^1.0.4
  get_it: ^9.2.1
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2
  freezed: ^3.2.5
  injectable: ^2.7.1+4
  flutter_secure_storage: ^10.0.0
  image_picker: ^1.2.1
  firebase_auth: ^6.3.0
  firebase_core: ^4.6.0
  firebase_messaging: ^16.1.3
  awesome_snackbar_content:
    git:
      url: https://github.com/aleemElmozogi/awesome_snackbar_content.git
      ref: fix/bubble-icon-cropping
  image_network: ^2.6.0
  pretty_dio_logger: ^1.4.0
  loading_indicator: ^3.1.1
  auto_route: ^11.1.0
  flutter_svg: ^2.2.4
  smooth_page_indicator: ^2.0.1
  pin_code_fields: ^9.3.0
  flashy_tab_bar2: ^0.0.10
  icons_plus: ^5.0.0
  google_maps_flutter: ^2.17.0
  map_location_picker: ^3.1.0
  flutter_form_builder: ^10.2.0
  toggle_switch: ^2.3.0
  flutter_speed_dial: ^7.0.0
  flutter_swipe_button: ^2.1.1+1
  qr_code_scanner_plus: ^2.1.1
  theme_tailor: any
  theme_tailor_annotation: ^3.1.3
  google_mlkit_barcode_scanning: ^0.14.2
  audioplayers: ^6.7.1
  hijri_date: ^1.1.0
  table_calendar: ^3.2.0
  syncfusion_flutter_charts: ^33.2.12
  qr_flutter: ^4.1.0
  local_auth: ^3.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_native_splash: ^2.4.6
  injectable_generator:
  build_runner: ^2.13.1
  dependency_validator: ^5.0.2
  flutter_lints: ^6.0.0
  flutter_gen_runner:
  json_serializable: ^6.11.0
  auto_route_generator:
  mason_cli: ^0.1.3


flutter:
  uses-material-design: true
  generate: false

  assets:
    - assets/images/
#    - assets/icons/
#    - assets/logo/
#    - assets/lottie/

  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Black.ttf
          weight: 900
        - asset: assets/fonts/Tajawal-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
        - asset: assets/fonts/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/Tajawal-Regular.ttf
          weight: 400
        - asset: assets/fonts/Tajawal-Light.ttf
          weight: 300
        - asset: assets/fonts/Tajawal-ExtraLight.ttf
          weight: 200
flutter_intl:
  enabled: true
